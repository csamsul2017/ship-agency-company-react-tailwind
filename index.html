          height: 48px;
          border: 4px solid #e2e8f0;
          border-bottom-color: #06b6d4;

          display: inline-block;
          box-sizing: border-box;
          animation: rotation 1s linear infinite;
          margin-bottom: 16px;
        }
        @keyframes rotation {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
        .initial-loader-text {
          color: #0b1b3d;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: 2px;
        }
